# Full-schema control experiment — no schema retrieval.
#
# The generator sees the entire allowed schema for the target database, so an
# error here is a generator limitation, not a retrieval miss. This is the
# reference point every retrieval method is later compared against.
#
# Usage:
#   chatsql experiment run \
#     --benchmark bird_mini_dev_sqlite_select_500 \
#     --strategy full_schema \
#     --config configs/experiments/full_schema_control.yaml

experiment:
  id_prefix: "full_schema_control"
  seed: 42

benchmark:
  name: "bird_mini_dev_sqlite_select_500"
  split: "mini_dev_sqlite"
  select_only: true
  revision: "b3d4bcbbae9a96934ad812551eb400c7a3b23c12"
  evaluator_revision: "b3d4bcbbae9a96934ad812551eb400c7a3b23c12"

strategy:
  name: "full_schema"

grounder:
  name: "full-schema"

model:
  provider: "openai"
  name: "gpt-4o-mini"
  revision: "2024-07-18"
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 60.0
  max_retries: 3

execution:
  timeout_seconds: 30.0
  row_limit: 10000

output:
  runs_dir: "runs"
  log_raw_responses: true
