[project]
name = "chatsql"
version = "0.1.0"
description = "Research-first Text-to-SQL system with reproducible CHATSQL experiments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sqlglot>=26.0",
    "typer>=0.15",
]

[project.scripts]
chatsql = "chatsql.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatsql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chatsql"]
